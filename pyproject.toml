[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frameio-agent"
version = "0.5.0"
description = "Run Frame.io from your coding agent. Find clips, summarize notes, pull YouTube references, send review links."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Frame.io Agent Starter contributors" }]
keywords = ["frameio", "frame.io", "adobe", "oauth", "cli", "agent", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
# Image composition for `contact-sheet`. Add when you need that command.
images = [
  "Pillow>=10.0",
]

# YouTube/X ingestion for `refs add <youtube-url>`. yt-dlp is a moving
# target; pin a known-good version and bump deliberately.
youtube = [
  "yt-dlp>=2025.1.0",
]

dev = [
  "pytest>=8.0",
]
mcp = [
  "mcp>=1.0",
]

[project.scripts]
frameio-agent = "frameio_agent.cli:main"

[project.urls]
Homepage = "https://github.com/sheldondirector/frameio-agent"
Issues = "https://github.com/sheldondirector/frameio-agent/issues"

[tool.setuptools.packages.find]
include = ["frameio_agent*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
